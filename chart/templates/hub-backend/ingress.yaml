{{- if .Values.hub.ingress.enabled }}
{{- $isNginx := eq (include "ainsel.isNginx" .Values.hub.ingress.className) "true" -}}
{{- $annotations := fromYaml (include "ainsel.ingressAnnotations" (dict "isNginx" $isNginx "nginxOnly" (dict "nginx.ingress.kubernetes.io/use-regex" "true") "extra" .Values.hub.ingress.annotations)) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ainsel.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-backend
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.hub.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.hub.ingress.host }}
      secretName: {{ .Values.hub.ingress.tlsSecretName | default "hub-tls" }}
  rules:
    - host: {{ .Values.hub.ingress.host }}
      http:
        paths:
          {{- if $isNginx }}
          # Only /api/v1/* is published. The capture group is deliberately
          # restricted to `v1(/.*)?` rather than `.*` so that the hub's
          # /api/internal/* routes (agent task ack/nack, event ingest,
          # task logs, user-token validation) cannot be reached from outside
          # the cluster via the rewrite-target below. Those endpoints
          # authenticate with the cluster-wide X-Internal-Token shared
          # secret, which must never be exposed to internet traffic where it
          # can be replayed or brute-forced.
          #
          # Do not widen this back to `.*` without also moving the internal
          # routes onto a port the Service and Ingress do not publish.
          #
          # /health stays in-cluster only: the liveness and readiness probes
          # in deployment.yaml hit it directly on the pod.
          - path: {{ .Values.hub.ingress.path }}(/|$)(v1(/.*)?)
            pathType: ImplementationSpecific
            backend:
              service:
                name: hub-backend
                port:
                  name: http
          {{- else }}
          # Controller-agnostic variant: literal Prefix path, no nginx regex
          # or rewrite annotations. It preserves the same security property:
          # only <path>/v1/* is published, so the hub's /api/internal/*
          # routes (authenticated by the cluster-wide X-Internal-Token)
          # stay unreachable from outside the cluster. Do not widen this
          # path beyond <path>/v1.
          #
          # The hub serves its routes under /api/... — configure your
          # controller's rewrite middleware to map <path>/v1/* to
          # /api/v1/* (see "Ingress controllers" in docs/deployment.md).
          - path: {{ .Values.hub.ingress.path }}/v1
            pathType: Prefix
            backend:
              service:
                name: hub-backend
                port:
                  name: http
          {{- end }}
{{- end }}
