{{- if .Values.mcp.enabled }}
{{- if or (not .Values.auth.oidcIssuer) (not (.Values.auth.oidcAudience | default .Values.auth.oidcProjectId | default .Values.auth.oidcClientId)) }}
{{- fail "mcp.enabled requires auth.oidcIssuer and auth.oidcAudience or auth.oidcClientId" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ainsel-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ainsel-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ainsel-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ainsel-mcp
        app.kubernetes.io/component: mcp
        {{- with .Values.mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.mcp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: ainsel-mcp
      {{- with .Values.mcp.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.mcp.priorityClassName }}
      priorityClassName: {{ .Values.mcp.priorityClassName }}
      {{- end }}
      containers:
        - name: mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          {{- with .Values.mcp.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
          env:
            - name: PORT
              value: "{{ .Values.mcp.port }}"
            - name: HUB_URL
              value: http://hub-backend.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.hub.port }}
            - name: OIDC_ISSUER
              value: {{ .Values.auth.oidcIssuer | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.auth.oidcAudience | default .Values.auth.oidcProjectId | default .Values.auth.oidcClientId | quote }}
            - name: OIDC_SIGNING_ALGS
              value: {{ .Values.auth.oidcSigningAlgs | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidcClientId | quote }}
            {{- with include "ainsel.oidcRolesClaim" . }}
            - name: OIDC_ROLES_CLAIM
              value: {{ . | quote }}
            {{- end }}
            - name: OIDC_SCOPES
              value: {{ include "ainsel.oidcScopes" . | quote }}
            {{- if .Values.mcp.externalUrl }}
            - name: MCP_RESOURCE_URL
              value: {{ .Values.mcp.externalUrl | quote }}
            {{- end }}
            {{- if .Values.auth.internalValidateSecret }}
            - name: INTERNAL_VALIDATE_SECRET
              value: {{ .Values.auth.internalValidateSecret | quote }}
            {{- end }}
            {{- with .Values.mcp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          {{- with .Values.mcp.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.mcp.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
