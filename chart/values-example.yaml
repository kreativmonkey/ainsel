# Example values overlay for OSS users
# Copy this file and fill in your own values before deploying.
# Do NOT commit secrets into version control.

namespace: ainsel

agentOperator:
  image:
    repository: dpinsel/ainsel-k8s-ai-agent-operator
    tag: latest
    pullPolicy: IfNotPresent

connectorOperator:
  image:
    repository: dpinsel/ainsel-k8s-event-source-gateway-operator
    tag: latest
    pullPolicy: IfNotPresent
  # Pull policy for the webhook-receiver connector pods the operator creates.
  # Set to Always when using a mutable tag (e.g. dev/latest).
  connectorImagePullPolicy: IfNotPresent

hub:
  image:
    repository: dpinsel/ainsel-hub-backend
    tag: latest
    pullPolicy: IfNotPresent
  namespace: ainsel
  platformExternalUrl: "https://ainsel.example.com/ainsel"
  connectorImages:
    webhook:
      repository: dpinsel/ainsel-webhook-receiver
      tag: latest
  ingress:
    enabled: true
    host: ainsel.example.com
    path: /ainsel/api
    className: nginx
    # Secret holding the TLS certificate for this host
    tlsSecretName: hub-tls
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /api/$2
      # Example environment-specific annotations — uncomment and adjust:
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # nginx.ingress.kubernetes.io/auth-url: http://authelia.auth.svc.cluster.local:9091/authelia/api/authz/auth-request
      # nginx.ingress.kubernetes.io/auth-signin: https://ainsel.example.com/authelia/?rd=$scheme://$host$request_uri
ui:
  enabled: true
  basePath: /ainsel
  image:
    repository: dpinsel/ainsel-hub-frontend
    tag: latest
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    host: ainsel.example.com
    path: /ainsel(/|$)(.*)
    className: nginx
    # Secret holding the TLS certificate for this host
    tlsSecretName: ui-tls
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      # Example environment-specific annotations — uncomment and adjust:
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # nginx.ingress.kubernetes.io/auth-url: http://authelia.auth.svc.cluster.local:9091/authelia/api/authz/auth-request
      # nginx.ingress.kubernetes.io/auth-signin: https://ainsel.example.com/authelia/?rd=$scheme://$host$request_uri

postgres:
  enabled: true
  storage: 5Gi

observability:
  prometheus:
    url: ""
  metricsSource: "postgres"
  serviceMonitor:
    enabled: false
    labels: {}
  podMonitor:
    enabled: false
    labels: {}

auth:
  oidcIssuer: ""
  oidcClientId: ""
  oidcAudience: ""
  oidcSigningAlgs: "RS256"
  oidcScopes: "openid profile email offline_access"
  oidcRolesClaim: "groups"
  internalValidateSecret: ""

mcp:
  enabled: false
  image:
    repository: dpinsel/ainsel-mcp
    tag: latest
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    host: ainsel.example.com
    path: /ainsel/mcp
    className: nginx
    annotations:
      # Example environment-specific annotations — uncomment and adjust:
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # nginx.ingress.kubernetes.io/auth-url: http://authelia.auth.svc.cluster.local:9091/authelia/api/authz/auth-request
      # nginx.ingress.kubernetes.io/auth-signin: https://ainsel.example.com/authelia/?rd=$scheme://$host$request_uri
