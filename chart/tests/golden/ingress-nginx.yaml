apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ainsel-mcp
  namespace: ainsel
  labels:
    app.kubernetes.io/name: ainsel-mcp
    app.kubernetes.io/component: mcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /mcp$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: mcp.example.com
      http:
        paths:
          - path: /ainsel/mcp(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ainsel-mcp
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ainsel-mcp-oauth-metadata
  namespace: ainsel
  labels:
    app.kubernetes.io/name: ainsel-mcp
    app.kubernetes.io/component: mcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /.well-known/oauth-authorization-server
spec:
  ingressClassName: nginx
  rules:
    - host: mcp.example.com
      http:
        paths:
          - path: /.well-known/oauth-authorization-server/ainsel/mcp
            pathType: Exact
            backend:
              service:
                name: ainsel-mcp
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ainsel-mcp-oauth-protected-resource
  namespace: ainsel
  labels:
    app.kubernetes.io/name: ainsel-mcp
