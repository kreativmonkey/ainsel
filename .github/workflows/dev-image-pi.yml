name: Dev Image - pi

on:
  push:
    branches: [main]
    paths:
      - 'pi/**'
      - '.github/workflows/dev-image-pi.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'pi/**'
      - '.github/workflows/dev-image-pi.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built image to GHCR (default: build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        # The MAUI image apt-installs dotnet-sdk-8.0 (~2.5 GB unpacked) and
        # then installs the maui-android workload. From a cold buildx cache
        # this overflows the hosted runner's disk mid-dpkg
        # ("No space left on device", #359). The toolsets the runner ships
        # preinstalled are never used here — everything runs inside the image.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          df -h / || true
      - uses: actions/checkout@v7
      - name: Compute image metadata
        id: meta
        run: |
          short_sha=$(printf '%.7s' "$GITHUB_SHA")
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # Publishing is decided once, here, instead of being re-derived from
          # github.event_name at every step. A PR never publishes; a manual
          # dispatch publishes only if it was told to. Before this, a dispatch
          # from any feature branch pushed a :<short-sha> tag that no review
          # had ever looked at.
          publish=true
          case "$GITHUB_EVENT_NAME" in
            pull_request) publish=false ;;
            workflow_dispatch) publish='${{ inputs.publish }}' ;;
          esac
          if [ "$publish" != "true" ]; then publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          # The variants are published on the trunk (main) only, mirroring the
          # :dev rule from PR #182: their floating tags are what running agents
          # pull, so only trunk-integrated code may move them.
          publish_variants=false
          if [ "$publish" = "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            publish_variants=true
          fi
          echo "publish_variants=$publish_variants" >> "$GITHUB_OUTPUT"
          echo "base_image=ghcr.io/${owner}/ainsel-pi" >> "$GITHUB_OUTPUT"
          # Variant tags name the base built in this same run, so the Go and
          # MAUI images are always built on the pi base they belong with. When
          # nothing will be published the tag is local-only - it still has to be
          # a valid reference for the build to resolve.
          if [ "$publish_variants" = "true" ]; then
            echo "go_tags=ghcr.io/${owner}/ainsel-pi-go:1.24" >> "$GITHUB_OUTPUT"
            echo "maui_tags=ghcr.io/${owner}/ainsel-pi-maui:8.0" >> "$GITHUB_OUTPUT"
          else
            echo "go_tags=ghcr.io/${owner}/ainsel-pi-go:local-check" >> "$GITHUB_OUTPUT"
            echo "maui_tags=ghcr.io/${owner}/ainsel-pi-maui:local-check" >> "$GITHUB_OUTPUT"
          fi
          # The variants FROM this run's base, never a floating tag: a build tagged
          # with its own SHA must not silently contain whatever :dev happens to be.
          # Only possible once the base has reached the registry - buildx resolves
          # FROM there, not from the runner's image store, so a build-only run (a PR,
          # or a dispatch without publish) has no :<sha> of its own to build on and
          # falls back to :dev.
          if [ "$publish" = "true" ]; then
            echo "base_tag=${short_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "base_tag=dev" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "ghcr.io/${owner}/ainsel-pi:${short_sha}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "ghcr.io/${owner}/ainsel-pi:dev"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------- Base image (ainsel-pi) -----------------------------------
      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: pi
          file: pi/Dockerfile
          push: ${{ steps.meta.outputs.publish == 'true' }}
          load: ${{ steps.meta.outputs.publish != 'true' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}

      # ---------- Go variant (ainsel-pi-go:1.24) ---------------------------
      # Always built: PRs and opt-in dispatches verify it as a load-only
      # build; only a trunk push publishes the floating tag (decided by
      # publish_variants, never by the branch of a feature build).
      - name: Build and push Go variant
        uses: docker/build-push-action@v7
        with:
          context: pi
          file: pi/Dockerfile.go
          push: ${{ steps.meta.outputs.publish_variants == 'true' }}
          load: ${{ steps.meta.outputs.publish_variants != 'true' }}
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base_image }}
            BASE_TAG=${{ steps.meta.outputs.base_tag }}
          tags: ${{ steps.meta.outputs.go_tags }}

      # ---------- .NET MAUI variant (ainsel-pi-maui:8.0) -------------------
      - name: Build and push .NET MAUI variant
        uses: docker/build-push-action@v7
        with:
          context: pi
          file: pi/Dockerfile.maui
          push: ${{ steps.meta.outputs.publish_variants == 'true' }}
          load: ${{ steps.meta.outputs.publish_variants != 'true' }}
          provenance: false
          sbom: false
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base_image }}
            BASE_TAG=${{ steps.meta.outputs.base_tag }}
          tags: ${{ steps.meta.outputs.maui_tags }}
