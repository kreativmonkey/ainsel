name: Dev Image - services/chat-mcp

on:
  push:
    branches: [main]
    paths:
      - 'services/chat-mcp/**'
      - 'shared/api/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-chat-mcp.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'services/chat-mcp/**'
      - 'shared/api/**'
      - 'go.work'
      - '.github/workflows/dev-image-services-chat-mcp.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built image to GHCR (default: build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute image metadata
        id: meta
        run: |
          short_sha=$(printf '%.7s' "$GITHUB_SHA")
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # Publishing is decided once, here, instead of being re-derived from
          # github.event_name at every step. A PR never publishes; a manual
          # dispatch publishes only if it was told to. Before this, a dispatch
          # from any feature branch pushed a :<short-sha> tag that no review
          # had ever looked at.
          publish=true
          case "$GITHUB_EVENT_NAME" in
            pull_request) publish=false ;;
            workflow_dispatch) publish='${{ inputs.publish }}' ;;
          esac
          if [ "$publish" != "true" ]; then publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          {
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "ghcr.io/${owner}/ainsel-chat-mcp:${short_sha}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "ghcr.io/${owner}/ainsel-chat-mcp:dev"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/chat-mcp/Dockerfile
          push: ${{ steps.meta.outputs.publish == 'true' }}
          load: ${{ steps.meta.outputs.publish != 'true' }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, steps.meta.outputs.short_sha) || format('{0}-{1}', github.ref_name, steps.meta.outputs.short_sha) }}
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
